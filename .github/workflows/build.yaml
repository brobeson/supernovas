# cspell:dictionaries bash

name: Build & Test
on:
  workflow_dispatch:
  pull_request:
  push:

# From https://stackoverflow.com/a/72408109
# Create a group from the PR number, or the branch/tag name (if not a PR).
# Cancel in-progress runs if the PR, branch, or tag is updated.
concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  projectFiles:
    if: ${{ false }}
    name: Project Files
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1
  cppQuality:
    if: ${{ false }}
    name: C++ Analysis
    runs-on: ubuntu-26.04
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Install tools
        # cspell:ignore sarif pipx
        run: |
          sudo apt-get install cppcheck --yes --no-install-recommends
          pipx install lizard
        # cargo install clang-tidy-sarif
      - name: Clang-format
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
        # cspell:ignore Werror
        run: clang-format -Werror --dry-run --style=file **/*.[ch]pp
      - name: Lizard
        run: >
          lizard
          --Threshold nloc=50
          --Threshold cyclomatic_complexity=10
          --Threshold parameter_count=5
          --warnings_only
          --modified
      - name: CMake configure
        env:
          CXX: clang++
        run: cmake --preset debug
      - name: Clang-tidy
        run: run-clang-tidy -j $(nproc) -p build/debug
        # run: run-clang-tidy -j $(nproc) -p build/debug | clang-tidy-sarif >clang-tidy.sarif
      # - name: Upload SARIF
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: clang-tidy.sarif
      - name: Cppcheck # cspell:ignore Cppcheck
        run: |
          cd build/debug
          cppcheck \
            --project=project.cppcheck \
            --enable=all \
            --template='::error file={file},line={line},col={column}::[{id}] {message}' \
            --error-exitcode=1
  cppBuild:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-26.04] #, windows-2025-vs2026, macos-26-intel]
        workflow: [debug] #, release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: CMake Workflow
        env:
          CMAKE_GENERATOR: ${{ !startsWith(matrix.os, 'windows') && 'Ninja' || '' }}
          CXX: ${{ startsWith(matrix.os, 'ubuntu') && 'clang++' || '' }}
          CC: ${{ startsWith(matrix.os, 'ubuntu') && 'clang' || '' }}
        run: cmake --workflow ${{ matrix.workflow }}
      - name: sanity check
        run: |
          find . -name '*.gcno'
          find . -name '*.gcda'
          find . -name 'sample_test.cpp'
          find . -name '*.profraw'
      # - name: Test coverage
      #   if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.workflow == 'debug' }}
      #   # cspell:ignore gcovr
      #   run: |
      #     pipx install gcovr
      #     # cd build/${{ matrix.workflow }}
      #     # gcovr --verbose --root ../../ .
      #     # gcovr --verbose --root ${{ github.workspace }} --filter ${{github.workspace}} build/debug
      #     gcovr --root . build/debug
      - name: Test Coverage (LLVM)
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
        run: |
          sudo apt install llvm
          llvm-profdata merge -sparse build/debug/**/*.profraw -o coverage.profdata
          llvm-cov export build/debug/tests/supernovas/sample_test -instr-profile=coverage.profdata -ignore-filename-regex='build/.*' -format=lcov >build/coverage.info
      - name: Coverage report
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.workflow == 'debug' }}
        # cspell:ignore coverallsapp
        uses: coverallsapp/github-action@v2
        with:
          file: build/coverage.info
        #   format: lcov
