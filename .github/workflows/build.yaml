# cspell:dictionaries bash

name: Build & Test
on:
  workflow_dispatch:
  pull_request:
  push:

# From https://stackoverflow.com/a/72408109
# Create a group from the PR number, or the branch/tag name (if not a PR).
# Cancel in-progress runs if the PR, branch, or tag is updated.
concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  projectFiles:
    if: ${{ false }}
    name: Project Files
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1
  cppQuality:
    name: C++ Quality
    runs-on: ubuntu-26.04
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Install tools
        run: sudo apt-get install cppcheck --yes
      - name: Clang-format
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
        # cspell:ignore Werror
        run: clang-format -Werror --dry-run --style=file **/*.[ch]pp
      - name: CMake configure
        env:
          CXX: clang++
        run: cmake --preset debug
      - run: tree build/debug/_deps
      - name: Clang-tidy
        if: ${{ false }}
        run: run-clang-tidy -j $(nproc) -p build/debug
      - name: Cppcheck # cspell:ignore Cppcheck
        run: |
          cd build/debug
          cppcheck \
            --project=project.cppcheck \
            --enable=all \
            --template='::error file={file},line={line},col={column}::[{id}] {message}' \
            --error-exitcode=1
  cppBuild:
    if: ${{ false }}
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26-intel]
        workflow: [debug, release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: CMake Workflow
        env:
          CMAKE_GENERATOR: ${{ !startsWith(matrix.os, 'windows') && 'Ninja' || '' }}
          CXX: ${{ startsWith(matrix.os, 'ubuntu') && 'clang++' || '' }}
          CC: ${{ startsWith(matrix.os, 'ubuntu') && 'clang' || '' }}
        run: cmake --workflow ${{ matrix.workflow }}
