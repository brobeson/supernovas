# cspell:dictionaries bash

name: Build & Test
on:
  workflow_dispatch:
  pull_request:
  push:

# From https://stackoverflow.com/a/72408109
# Create a group from the PR number, or the branch/tag name (if not a PR).
# Cancel in-progress runs if the PR, branch, or tag is updated.
concurrency:
  group: ${{github.workflow}}-${{github.event.pull_request.number || github.ref}}
  cancel-in-progress: true

jobs:
  projectFiles:
    name: Project Files
    uses: brobeson/SupportFileQuality/.github/workflows/support_files.yaml@v1
  cppQuality:
    name: C++ Analysis
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash --noprofile --norc -O globstar -eo pipefail {0}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: Clang-format # cspell:ignore Werror
        run: clang-format -Werror --dry-run --style=file **/*.[ch]pp
      - name: Lizard # cspell:ignore nloc pipx
        run: |
          pipx install lizard
          lizard \
            --Threshold nloc=50 \
            --Threshold cyclomatic_complexity=10 \
            --Threshold parameter_count=5 \
            --warnings_only \
            --modified \
      - name: CMake configure
        env:
          CXX: clang++
        run: cmake --preset debug
      - name: Clang-tidy
        run: run-clang-tidy -j $(nproc) -p build/debug
      - name: Cppcheck # cspell:ignore Cppcheck
        run: |
          sudo apt-get install cppcheck --yes --no-install-recommends
          cd build/debug
          cppcheck \
            --project=project.cppcheck \
            --enable=all \
            --template='::error file={file},line={line},col={column}::[{id}] {message}' \
            --error-exitcode=1
  cppBuild:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-26.04, windows-2025-vs2026, macos-26-intel]
        # cxx: [g++, clang++]
        workflow: [debug, release, vs-debug, vs-release]
        exclude:
          - os: [windows-2025-vs2026]
          - workflow: [vs-debug, vs-release]
        include:
          - os: windows-2025-vs2026
            workflow: [vs-debug, vs-release]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Clone the repository
        uses: actions/checkout@v7
      - name: CMake Workflow
        env:
          CMAKE_GENERATOR: ${{ startsWith(matrix.os, 'windows') && 'Visual Studio 18 2026' || 'Ninja' }}
          # CXX: ${{ startsWith(matrix.os, 'ubuntu') && 'clang++' || '' }}
          # CC: ${{ startsWith(matrix.os, 'ubuntu') && 'clang' || '' }}
        run: cmake --workflow ${{ matrix.workflow }}
      - name: Test Coverage (GCC) # cspell:ignore gcovr
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.workflow == 'debug' }}
        run: |
          pipx install gcovr
          gcovr --root . build/debug
      - name: Coverage report # cspell:ignore coverallsapp
        if: ${{ startsWith(matrix.os, 'ubuntu') && matrix.workflow == 'debug' }}
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/coverage.info
