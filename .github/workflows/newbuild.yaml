on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} | ${{ matrix.cpp_compiler}} | ${{ matrix.preset }}"
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        cpp_compiler: [g++, clang++, cl]
        preset: [debug, release]
        exclude:
          - os: windows-latest
            cpp_compiler: g++
          - os: windows-latest
            cpp_compiler: clang++
          - os: ubuntu-latest
            cpp_compiler: cl
          - os: macos-latest
            cpp_compiler: cl
    steps:
      - uses: actions/checkout@v4
      - name: Set Ninja Generator
        if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
        run: echo "CMAKE_GENERATOR=Ninja" >> ${GITHUB_ENV}
      - name: Configure CMake
        run: >
          cmake --preset ${{ matrix.preset }}
          -D CMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -S ${{ github.workspace }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        # cspell:ignore ctest
        run: ctest --preset ${{ matrix.preset }}
